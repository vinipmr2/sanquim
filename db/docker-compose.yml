version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studi_postgres
    restart: always
    environment:
      POSTGRES_DB: studi_db
      POSTGRES_USER: studi_user
      POSTGRES_PASSWORD: studi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studi_user -d studi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
