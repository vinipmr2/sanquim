server.port=${SERVER_PORT:8085}

# Configuração do PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studi_db}
spring.datasource.username=${DB_USER:studi_user}
spring.datasource.password=${DB_PASSWORD:studi_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.br.edu.sanquim.studi=INFO
