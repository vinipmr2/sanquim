server.port=${SERVER_PORT:8085}

# Configuração de Banco de Dados
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:studi_db}
db.user=${DB_USER:studi_user}
db.password=${DB_PASSWORD:studi_password}

spring.datasource.url=jdbc:postgresql://${db.host}:${db.port}/${db.name}
spring.datasource.username=${db.user}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configurações de JWT
jwt.secret=studi-plus-super-secret-key-colegio-sanquim-2026-fatec-ads-token
jwt.expiration=86400000

# Springdoc OpenAPI / Swagger UI (acessível em /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# H2 Console (disponível quando em modo de desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.br.edu.sanquim.studi=INFO
logging.level.org.springframework.security=WARN
